services:
  # Frontend estático (index.html en la raíz)
  - type: web
    name: onetpl
    runtime: static
    buildCommand: echo "static site, no build"
    staticPublishPath: ./
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend API conectada a Neon Postgres
  - type: web
    name: onetpl-api
    runtime: node
    rootDir: api
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://onetpl.onrender.com
      - key: NODE_VERSION
        value: 20
